# ── Gradle JVM ─────────────────────────────────────────────────────────
# Memoria asignada al daemon de Gradle (necesario para Compose + Hilt + KSP)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── Compilación paralela ───────────────────────────────────────────────
org.gradle.parallel=true

# ── AndroidX ───────────────────────────────────────────────────────────
android.useAndroidX=true
# Jetifier deshabilitado: todas las dependencias del proyecto ya son AndroidX.
# Si alguna dependencia futura requiere support-library, volver a habilitar.
android.enableJetifier=false

# ── Kotlin ─────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Android (no generar BuildConfig por defecto — solo donde se habilite) ──
android.defaults.buildfeatures.buildconfig=false
org.gradle.configuration-cache=true
